# Builds the site and publishes it to GitHub Pages on every push to MIndsuiteOffering.
# Live at https://mjaffry01.github.io/mindsuiteImagination/
#
# GitHub Pages serves static files only. The AI guide, the proposal form and the guide emails
# need the guide server (render.yaml or the Dockerfile). Set the repository variable
# GUIDE_SERVER_URL (Settings > Secrets and variables > Actions > Variables) to its address, e.g.
# https://mindsuite-guide.onrender.com, and re-run this workflow. Without it the guide uses
# catalogue matching and the form opens the visitor's email app.
name: Deploy to GitHub Pages

on:
  push:
    branches: [MIndsuiteOffering]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Project pages live under /<repo-name>/, so assets need that base path.
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_ASSISTANT_URL: ${{ vars.GUIDE_SERVER_URL && format('{0}/api/assistant', vars.GUIDE_SERVER_URL) || '' }}
          VITE_ENQUIRY_URL: ${{ vars.GUIDE_SERVER_URL && format('{0}/api/enquiry', vars.GUIDE_SERVER_URL) || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
