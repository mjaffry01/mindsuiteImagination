eaders address the most consequential weaknesses first.&quot;,&quot;Question&quot;:&quot;What would happen to the business if this application failed?&quot;},{&quot;No&quot;:&quot;3&quot;,&quot;Family&quot;:&quot;Software &amp; Product Engineering&quot;,&quot;Group&quot;:&quot;Build &amp; Transform&quot;,&quot;Area&quot;:&quot;Technology Strategy &amp; Advisory&quot;,&quot;Offering&quot;:&quot;Technology Due Diligence&quot;,&quot;Definition&quot;:&quot;An independent technical examination of a software asset in an investment, acquisition or partnership decision. It evaluates the credibility of the technology, delivery capability and likely remediation obligations within an agreed evidence boundary.&quot;,&quot;Scope&quot;:&quot;Inspect architecture, code quality, ownership evidence, operations and engineering practices.&quot;,&quot;Deliverables&quot;:&quot;Technical diligence report; key concerns; remediation estimates and open questions.&quot;,&quot;Value&quot;:&quot;Makes technology-related deal assumptions more transparent.&quot;,&quot;Question&quot;:&quot;What transaction decision and deadline must the review support?&quot;},{&quot;No&quot;:&quot;4&quot;,&quot;Family&quot;:&quot;Software &amp; Product Engineering&quot;,&quot;Group&quot;:&quot;Build &amp; Transform&quot;,&quot;Area&quot;:&quot;Technology Strategy &amp; Advisory&quot;,&quot;Offering&quot;:&quot;Architecture Strategy &amp; Roadmap&quot;,&quot;Definition&quot;:&quot;A planning service that defines the desired future structure of applications, data and integrations, then sequences the changes needed to reach it. Trade-offs are recorded against business priorities and constraints.&quot;,&quot;Scope&quot;:&quot;Assess current state; compare design options; define target state and migration stages.&quot;,&quot;Deliverables&quot;:&quot;Architecture blueprint; decision records; dependency map; phased roadmap.&quot;,&quot;Value&quot;:&quot;Aligns technology investment with business growth and operational n t;13&quot;,&quot;Family&quot;:&quot;Software &amp; Product Engineering&quot;,&quot;Group&quot;:&quot;Build &amp; Transform&quot;,&quot;Area&quot;:&quot;Application Modernization&quot;,&quot;Offering&quot;:&quot;Modernization Discovery &amp; Pilot&quot;,&quot;Definition&quot;:&quot;A starting engagement that combines legacy-system discovery with a limited modernization experiment. The pilot tests whether the proposed approach can preserve essential behavior and reduce risk before a wider migration or replacement is approved.&quot;,&quot;Scope&quot;:&quot;Map dependencies; compare options; implement a bounded pilot; evaluate results.&quot;,&quot;Deliverables&quot;:&quot;Modernization assessment; pilot evidence; recommended migration roadmap.&quot;,&quot;Value&quot;:&quot;Replaces speculative transformation plans with evidence from a practical trial.&quot;,&quot;Question&quot;:&quot;Which legacy capability is representative enough to test the modernization approach?&quot;},{&quot;No&quot;:&quot;14&quot;,&quot;Family&quot;:&quot;Software &amp; Product Engineering&quot;,&quot;Group&quot;:&quot;Build &amp; Transform&quot;,&quot;Area&quot;:&quot;Application Modernization&quot;,&quot;Offering&quot;:&quot;Technical Debt Assessment &amp; Action Plan&quot;,&quot;Definition&quot;:&quot;An assessment of accumulated technical shortcuts, obsolete components and structural weaknesses that make software costly or risky to change. It converts those issues into a ranked action plan based on business impact and remediation effort.&quot;,&quot;Scope&quot;:&quot;Identify debt; assess change friction; estimate effort; prioritize treatment.&quot;,&quot;Deliverables&quot;:&quot;Technical debt register; impact assessment; sequenced remediation backlog.&quot;,&quot;Value&quot;:&quot;Directs engineering effort toward debt that materially affects delivery or operations.&quot;,&quot;Question&quot;:&quot;Where does technical debt most often delay releases or cause incidents?&quot;},{&quot;No&quot;:&quot;15&quot;,&quot;Family&quot;:&quot;Software &amp; Product Engineering&quot;,&quot;Group&quot;:&quot;Build &amp; Transform&quot;,&quot;Area&quot;:&quot;Application Modernization&quot;,&quot;Offering&quot;:&quot;Legacy Application Review &amp; Roadmap&quot;,&quot;Definition&quot;:&quot;An evaluation of an older application to determine whether to retain, upgrade, restructure, replace or retire its capabilities. The roadmap considers business dependence, technology support, integration complexity and the practicality of phased change.&quot;,&quot;Scope&quot;:&quot;Inventory functions and dependencies; assess support risks; compare modernization paths.&quot;,&quot;Deliverables&quot;:&quot;Legacy assessment; option comparison; dependency map; transition roadmap.&quot;,&quot;Value&quot;:&quot;Clarifies a sustainable path for business-critical legacy software.&quot;,&quot;Question&quot;:&quot;Which business processes depend on the application and cannot be interrupted?&quot;},{&quot;No&quot;:&quot;16&quot;,&quot;Family&quot;:&quot;Software &amp; Product Engineering&quot;,&quot;Group&quot;:&quot;Build &amp; Transform&quot;,&quot;Area&quot;:&quot;Application Modernization&quot;,&quot;Offering&quot;:&quot;Framework &amp; Runtime Upgrades&quot;,&quot;Definition&quot;:&quot;A controlled upgrade of application frameworks, language runtimes or supporting libraries to a selected supported version. Compatibility work and regression testing address behavioral changes, removed features and dependencies affected by the upgrade.&quot;,&quot;Scope&quot;:&quot;Review compatibility; update dependencies; adapt code; test and plan rollback.&quot;,&quot;Deliverables&quot;:&quot;Upgraded application; compatibility findings; regression evidence; rollback plan.&quot;,&quot;Value&quot;:&quot;Reduces exposure to unsupported components and enables future maintenance.&quot;,&quot;Question&quot;:&quot;Which versions are in use and which dependencies constrain the upgrade?&quot;},{&quot;No&quo     }
